<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Carnicería</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <!-- Notificaciones flotantes -->
    <div id="toast-container"></div>

    <!-- PANTALLA DE LOGIN -->
    <div id="login-view" class="view">
        <div class="login-box glass-panel">
            <div class="logo">
                <i class="ph-fill ph-storefront"></i>
                <h2>Carnes Admin</h2>
            </div>
            <form id="login-form">
                <div class="input-group">
                    <i class="ph ph-user"></i>
                    <input type="text" id="username" placeholder="Usuario" required autocomplete="username">
                </div>
                <div class="input-group">
                    <i class="ph ph-lock"></i>
                    <input type="password" id="password" placeholder="Contraseña" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary" id="login-btn">
                    <span>Ingresar</span>
                    <i class="ph ph-arrow-right"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- PANEL DE CONTROL (DASHBOARD) -->
    <div id="dashboard-view" class="view">
        
        <!-- Sidebar -->
        <aside class="sidebar glass-panel">
            <div class="logo">
                <i class="ph-fill ph-storefront"></i>
                <h2>Admin</h2>
            </div>
            <nav class="nav-menu">
                <a href="#" data-target="productos" class="nav-link active">
                    <i class="ph ph-package"></i> Productos
                </a>
                <a href="#" data-target="usuarios" class="nav-link">
                    <i class="ph ph-users"></i> Usuarios
                </a>
                <a href="#" data-target="seo" class="nav-link">
                    <i class="ph ph-magnifying-glass"></i> SEO
                </a>
                <a href="#" data-target="scripts" class="nav-link">
                    <i class="ph ph-code"></i> Scripts
                </a>
                <a href="#" data-target="cache" class="nav-link">
                    <i class="ph ph-lightning"></i> Caché
                </a>
                <a href="#" data-target="seguridad" class="nav-link">
                    <i class="ph ph-shield-check"></i> Seguridad
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="avatar"><i class="ph-fill ph-user-circle"></i></div>
                    <span id="current-username">Admin</span>
                </div>
                <button id="logout-btn" class="btn btn-icon" title="Cerrar Sesión">
                    <i class="ph ph-sign-out"></i>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar glass-panel">
                <h1 id="page-title">Productos</h1>
            </header>
            
            <div class="content-area glass-panel" id="content-area">
                <!-- El contenido dinámico se inyectará aquí -->
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/components.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
