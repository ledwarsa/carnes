<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C de Carne - La más alta calidad</title>
    <!-- Favicon -->
    <link rel="icon" href="uploads/logofull-sinfondo.png" type="image/png">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- AOS CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        #products-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2rem;
        }
        @media (max-width: 1200px) {
            #products-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 900px) {
            #products-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 600px) {
            #products-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="container top-bar-content">
            <div class="top-info">
                <span>Teléfono 300 000 00 00</span>
                <span>Bogotá, Colombia</span>
            </div>
            <div class="top-cart">
                <i class="ph ph-shopping-cart"></i>
                <span class="cart-badge">1</span>
            </div>
        </div>
    </div>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo">
                <img src="uploads/logofull-sinfondo.png" style="max-height: 120px;" alt="C de Carne">
            </a>
            <nav class="nav-links">
                <a href="index.html">INICIO</a>
                <a href="quienes-somos.html">NOSOTROS</a>
                <a href="index.html#productos" class="active">PRODUCTOS</a>
                <a href="combos.html">COMBOS</a>
                <a href="index.html#recetas">RECETAS Y TIPS</a>
                <a href="index.html#contacto">CONTACTO</a>
            </nav>
            <a href="productos.html" class="btn btn-red-outline">Comprar ahora</a>
        </div>
    </header>

    <!-- Header Spacing -->
    <div style="height: 170px; background: #111; width: 100%;"></div>

    <!-- Catálogo de Productos de la Categoría -->
    <section class="catalog-section" style="padding: 4rem 0; background-color: #f9f9f9; min-height: 50vh;">
        <div class="container" style="max-width: 1500px;">
            <h2 id="cat-title" style="margin-bottom: 1.5rem; font-size: 1.5rem; color: #1a1a1a;">Categoría</h2>
            <div id="products-grid">
                <p style="grid-column: 1/-1; text-align: center; color: #999;" id="catalog-loading">Cargando catálogo...</p>
            </div>
            <script>
                document.addEventListener('DOMContentLoaded', async () => {
                    const params = new URLSearchParams(window.location.search);
                    let category = params.get('cat');
                    
                    if (!category) {
                        const match = window.location.pathname.match(/cortes-de-([a-z]+)/);
                        if (match) category = match[1];
                    }
                    
                    const titles = {
                        'res': 'Cortes de Res',
                        'cerdo': 'Cortes de Cerdo',
                        'pollo': 'Pollo Fresco'
                    };
                    const descs = {
                        'res': 'Cortes jugosos y llenos de sabor, ideales para tus asados familiares o platos especiales.',
                        'cerdo': 'Textura suave y versatilidad inigualable. Perfecto para cualquier receta que imagines.',
                        'pollo': 'Fresco, saludable y delicioso. La opción más versátil para tu día a día.'
                    };
                    
                    if(category && titles[category]) {
                        document.getElementById('cat-title').textContent = titles[category];
                    } else {
                        document.getElementById('cat-title').textContent = 'Todos los Productos';
                    }

                    const grid = document.getElementById('products-grid');
                    if (!grid) return;
                    
                    try {
                        const promoRes = await fetch('api/promotions.php?t=' + new Date().getTime());
                        let promotions = [];
                        if (promoRes.ok) promotions = await promoRes.json();
                        window.promoEngine = new PromotionEngine(promotions);

                        const response = await fetch('api/products.php?t=' + new Date().getTime());
                        if (!response.ok) throw new Error('HTTP status ' + response.status);
                        
                        let products = await response.json();
                        
                        if (category) {
                            products = products.filter(p => p.category === category);
                        }
                        
                        if (products.length === 0) {
                            grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #999;">No hay productos en esta categoría aún.</p>';
                            return;
                        }
                        
                        grid.innerHTML = '';
                        
                        products.forEach(product => {
                            const isSoldOut = product.is_sold_out === true || product.is_sold_out === "true" || product.is_sold_out === 1;
                            
                            
                    const promoData = window.promoEngine.applyToProduct(product);
                    
                    const priceHtml = promoData.hasPromotion 
                        ? `
                        <div style="font-size: 0.8rem; color: var(--primary); text-transform: uppercase; margin-bottom: 0.5rem; font-weight: bold;">-${promoData.discountPercent}% ${promoData.promoName}</div>
                        <div class="price" style="margin-bottom: 1rem;">
                            <span style="text-decoration: line-through; color: #999; font-size: 0.9rem; margin-right: 0.5rem;">${promoData.originalPrice.toLocaleString('es-CO')}</span>
                            <span style="color: var(--primary); font-weight: bold; font-size: 1.25rem;">${promoData.finalPrice.toLocaleString('es-CO')}</span>
                        </div>`
                        : `<div class="price">${promoData.originalPrice.toLocaleString('es-CO')}</div>`;

                    const addPrice = promoData.finalPrice;
                    
                    const card = document.createElement('div');
                            card.className = `product-card`;
                            card.style.background = '#fff';
                            card.style.borderRadius = '8px';
                            card.style.padding = '1rem';
                            card.style.textAlign = 'center';
                            card.style.boxShadow = '0 4px 6px rgba(0,0,0,0.05)';
                            
                            const imageHtml = product.image 
                                ? `<img src="${product.image}" alt="${product.name}" style="width:100%; height:200px; object-fit:cover; border-radius:4px; margin-bottom:1rem; ${isSoldOut ? 'filter: grayscale(100%); opacity:0.6;' : ''}">` 
                                : `<div style="height:200px; background:#f5f5f5; display:flex; align-items:center; justify-content:center; margin-bottom:1rem; border-radius:4px;"><i class="ph ph-image" style="font-size:3rem; color:#ccc;"></i></div>`;
                                
                            const buyButton = isSoldOut
                                ? `<span class="btn btn-red-outline" style="opacity:0.5; border-color:#ccc; color:#ccc; background:transparent;">Agotado</span>`
                                : `<button class="btn btn-red-outline add-to-cart-btn" data-id="${product.id}" data-name="${product.name}" data-price="${addPrice}" data-image="${product.image}">Añadir al carrito</button>`;

                            let priceDisplay = product.price;
                            if (priceDisplay && !isNaN(parseFloat(priceDisplay)) && !priceDisplay.toString().includes('$')) {
                                priceDisplay = '$' + priceDisplay;
                            } else if (!priceDisplay) {
                                priceDisplay = '$0.00';
                            } else if (!priceDisplay.toString().startsWith('$')) {
                                priceDisplay = '$' + priceDisplay;
                            }

                            card.innerHTML = `
                                ${imageHtml}
                                <h3 style="font-size:1.1rem; margin-bottom:0.5rem; color:#1a1a1a;">${product.name}</h3>
                                <p style="font-size:0.85rem; color:#666; margin-bottom:1rem; height:40px; overflow:hidden;">${product.description || ''}</p>
                                ${priceHtml}
                                ${buyButton}
                            `;
                            
                            grid.appendChild(card);
                        });
                        
                    } catch (error) {
                        grid.innerHTML = `<p style="color:red; grid-column:1/-1; text-align:center;">Error al cargar el catálogo: ${error.message}</p>`;
                    }
                });
            </script>
        </div>
    </section>



    <!-- Footer -->
    <footer class="main-footer" id="contacto">
        <div class="container footer-content">
            <div class="footer-left">
                <span class="subtitle" style="color:var(--primary); margin-bottom:1rem; display:block;">CONTÁCTANOS</span>
                <p>Bogotá, Colombia</p>
                <p>Tel 300 00 00</p>
                <div class="social-links">
                    <a href="#" class="social-icon red"><i class="ph-fill ph-facebook-logo"></i></a>
                    <a href="#" class="social-icon"><i class="ph-fill ph-instagram-logo"></i></a>
                </div>
            </div>
            <div class="footer-right">
                <div class="logo">
                    <img src="uploads/logofull-sinfondo.png" style="max-height: 180px;" alt="C de Carne">
                </div>
            </div>
        </div>
        <div class="footer-bottom">
            <div class="container bottom-flex">
                <span>© Copyright 2026 By C de Carne</span>
                <span>Terminos & Condiciones | Políticas de privacidad</span>
            </div>
        </div>
    </footer>

    <script src="js/promotions.js"></script>
    <script src="js/cart.js?v=3"></script>
    <script src="js/app.js?v=3"></script>
    <!-- AOS JS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            once: true,
            offset: 100,
            duration: 800,
        });
    </script>
</body>
</html>
